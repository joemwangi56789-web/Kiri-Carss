<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a Story | Kiri Stories</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="stories.css"></head><body><header class="story-header"><a class="story-brand" href="stories.html">← KIRI STORIES</a><nav class="story-nav"><a href="index.html">Marketplace</a><a href="community-guidelines.html">Guidelines</a></nav></header><main class="story-wrap"><div class="story-heading"><h1>Write your story</h1><p>Alternate paragraphs and images in any order. You are responsible for the content and images you publish.</p></div><section class="story-card"><div class="story-field"><label for="storyTitle">Story title</label><input id="storyTitle" maxlength="140" placeholder="Give your story a clear title"></div><div class="story-field"><label for="storyCategory">Topic</label><select id="storyCategory"><option>Automotive</option><option>Education</option><option>Experiences</option><option>Creativity</option><option>Entertainment</option><option>Other</option></select></div><div class="story-field"><label for="storyExcerpt">Short introduction (optional)</label><textarea id="storyExcerpt" maxlength="300" placeholder="A short preview for readers"></textarea></div><div class="story-toolbar"><button type="button" class="story-btn" id="addParagraph">＋ Add paragraph</button><button type="button" class="story-btn secondary" id="addImage">＋ Insert image</button></div><p class="story-note">JPG, PNG or WebP up to 8 MB. Images upload as you add them. Move blocks up or down to arrange your article.</p><div id="storyBlocks"></div><div class="story-field"><label><input id="authorDeclaration" type="checkbox" style="width:auto"> I confirm that I am responsible for this article and its images, have the rights to publish them, and have followed the Terms of Use and Community Guidelines.</label></div><p id="editorMessage" class="story-status" role="status"></p><div class="story-toolbar"><button type="button" class="story-btn" id="publishStory">Publish story</button><a class="story-btn secondary" href="stories.html">Cancel</a></div></section></main><input type="file" id="storyImagePicker" accept="image/jpeg,image/png,image/webp" hidden><script type="module" src="story-editor.js"></script></body></html>
