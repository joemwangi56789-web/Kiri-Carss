name: Validate Kiri Cars alert functions

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/saved-search-alert-system]

jobs:
  functions-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install function dependencies
        run: npm install --no-audit --no-fund
        working-directory: functions
      - name: Check Cloud Functions syntax
        run: node --check index.js
        working-directory: functions
      - name: Check browser module syntax
        run: |
          for file in app.js admin.js buyer.js saved-searches.js verify-alert.js manage-alert.js manage-marketing.js confirm-alert.js; do
            node --input-type=module --check < "$file"
          done
