name: Firestore Rules Tests

on:
  push:
    branches:
      - feature/listing-payments-and-renewals
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for the Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install test dependencies
        run: npm install

      - name: Run Firestore rules tests in the emulator
        run: npm run test:rules:emulator
