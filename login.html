
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kiri Cars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <h1>Kiri Cars</h1>
      <p>Sign in to your dashboard</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <p class="forgot-password-link">
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
        </p>

        <button type="submit" id="loginButton">Sign In</button>
      </form>

      <div class="divider" role="separator" aria-label="or">
        <span>or</span>
      </div>

      <button type="button" id="googleLoginButton" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <p id="message" role="status" aria-live="polite"></p>
      <p>New to Kiri Cars? <a href="seller-register.html">Register as a dealership or broker</a></p>
      <a href="index.html">Back to Kiri Cars</a>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword,
      signOut,
      signInWithPopup,
      GoogleAuthProvider,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const googleLoginButton = document.getElementById("googleLoginButton");
    const message = document.getElementById("message");
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");

    function showMessage(text, isError = true) {
      message.textContent = text;
      message.style.color = isError ? "#c62828" : "#167a35";
    }

    // Check for existing session on page load
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userRef = doc(db, "admins", user.uid);
          const userSnap = await getDoc(userRef);
          
          if (userSnap.exists()) {
            const profile = userSnap.data();
            const role = String(profile.role || "").trim().toLowerCase();
            
            // Only auto-redirect if account is active and has valid role
            if (profile.active === true && profile.accountStatus !== "suspended" && 
                (role === "dealer" || role === "admin" || role === "owner")) {
              showMessage("Session restored. Redirecting...", false);
              window.location.href = role === "owner" ? "owner.html" : "admin.html";
              return;
            }
          }
        } catch (error) {
          console.warn("Session check failed:", error);
        }
      }
      // No valid session - show login form
    });

    // Google Sign-In handler
    async function handleGoogleSignIn() {
      const provider = new GoogleAuthProvider();
      googleLoginButton.disabled = true;
      googleLoginButton.textContent = "Signing in...";
      showMessage("Redirecting to Google...", false);

      try {
        const result = await signInWithPopup(auth, provider);
        const signedInUser = result.user;

        const userRef = doc(db, "admins", signedInUser.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await signOut(auth);
          showMessage("No admin profile found for this Google account. Please contact Kiri Cars support.");
          return;
        }

        const profile = userSnap.data();
        const role = String(profile.role || "").trim().toLowerCase();

        if (profile.active !== true || profile.accountStatus === "suspended") {
          await signOut(auth);
          showMessage("This account is inactive or suspended. Please contact Kiri Cars support.");
          return;
        }

        if (role === "dealer") {
          showMessage("Sign-in successful. Opening your seller dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        if (role === "owner") {
          showMessage("Login successful. Opening owner dashboard...", false);
          window.location.href = "owner.html";
          return;
        }

        if (role === "admin") {
          showMessage("Login successful. Opening admin dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        await signOut(auth);
        showMessage("This account has an unrecognized role. Please contact Kiri Cars support.");

      } catch (error) {
        console.error("Google sign-in error:", error);
        let errorText = "Google sign-in failed. Please try again.";

        if (error.code === "auth/popup-closed-by-user") {
          errorText = "Sign-in cancelled.";
        } else if (error.code === "auth/cancelled-popup-request") {
          errorText = "Please allow popups for this site to sign in with Google.";
        } else if (error.code === "permission-denied" || error.code === "firestore/permission-denied") {
          errorText = "We couldn't verify your account right now. Please try again later or contact Kiri Cars support.";
        }

        showMessage(errorText);
      } finally {
        googleLoginButton.disabled = false;
        googleLoginButton.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span>Continue with Google</span>';
      }
    }

    googleLoginButton.addEventListener("click", handleGoogleSignIn);

    // Forgot password handler
    forgotPasswordLink.addEventListener("click", async function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      if (!email) {
        showMessage("Please enter your email address first.", true);
        emailInput.focus();
        return;
      }

      forgotPasswordLink.textContent = "Sending...";
      forgotPasswordLink.style.pointerEvents = "none";
      showMessage("Sending password reset email...", false);

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage("Password reset email sent! Check your inbox (and spam folder).", false);
      } catch (error) {
        let errorText = "Could not send reset email. Please try again.";
        if (error.code === "auth/user-not-found") {
          errorText = "No account found with this email. Please check the address.";
        } else if (error.code === "auth/invalid-email") {
          errorText = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
          errorText = "Too many requests. Please wait a moment and try again.";
        }
        showMessage(errorText, true);
      } finally {
        forgotPasswordLink.textContent = "Forgot password?";
        forgotPasswordLink.style.pointerEvents = "auto";
      }
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      loginButton.textContent = "Checking account...";
      showMessage("Signing in...", false);

      let signedInUser = null;

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        signedInUser = result.user;

        const userRef = doc(db, "admins", signedInUser.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await signOut(auth);
          showMessage("We couldn't find an account profile for this login. Please contact Kiri Cars support.");
          return;
        }

        const profile = userSnap.data();

        const role = String(profile.role || "").trim().toLowerCase();

        if (profile.active !== true || profile.accountStatus === "suspended") {
          await signOut(auth);
          showMessage("This account is inactive or suspended. Please contact Kiri Cars support.");
          return;
        }

        if (role === "dealer") {
          showMessage("Sign-in successful. Opening your seller dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        if (role === "owner") {
          showMessage("Login successful. Opening owner dashboard...", false);
          window.location.href = "owner.html";
          return;
        }

        if (role === "admin") {
          showMessage("Login successful. Opening admin dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        await signOut(auth);
        showMessage("This account has an unrecognized role. Please contact Kiri Cars support.");

      } catch (error) {
        if (signedInUser) {
          try {
            await signOut(auth);
          } catch (signOutError) {
            // Keep the original login error for display.
          }
        }

        let errorText = "We couldn't sign you in. Please check your details and try again.";

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          errorText = "Incorrect email or password.";
        } else if (error.code === "permission-denied" ||
                   error.code === "firestore/permission-denied") {
          errorText =
            "We couldn't verify your account right now. Please try again later or contact Kiri Cars support.";
        } else if (error.code === "auth/too-many-requests") {
          errorText = "Too many login attempts. Please wait before trying again.";
        }

        showMessage(errorText);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
