
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kiri Cars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <h1>Kiri Cars</h1>
      <p>Sign in to your dashboard</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">Sign In</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
      <p>New to Kiri Cars? <a href="seller-register.html">Register as a dealership or broker</a></p>
      <a href="index.html">Back to Kiri Cars</a>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, isError = true) {
      message.textContent = text;
      message.style.color = isError ? "#c62828" : "#167a35";
    }

login.html    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      loginButton.textContent = "Checking account...";
      showMessage("Signing in...", false);

      let signedInUser = null;

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        signedInUser = result.user;

        const userRef = doc(db, "admins", signedInUser.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await signOut(auth);
          showMessage("We couldn't find an account profile for this login. Please contact Kiri Cars support.");
          return;
        }

        const profile = userSnap.data();

        const role = String(profile.role || "").trim().toLowerCase();

        if (role === "dealer") {
          showMessage("Sign-in successful. Opening your seller dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        if (profile.active !== true) {
          await signOut(auth);
          showMessage("This account is inactive or suspended. Please contact Kiri Cars support.");
          return;
        }

        if (role === "owner") {
          showMessage("Login successful. Opening owner dashboard...", false);
          window.location.href = "owner.html";
          return;
        }

        if (role === "admin") {
          showMessage("Login successful. Opening admin dashboard...", false);
          window.location.href = "admin.html";
          return;
        }

        await signOut(auth);
        showMessage("This account has an unrecognized role. Please contact Kiri Cars support.");

      } catch (error) {
        if (signedInUser) {
          try {
            await signOut(auth);
          } catch (signOutError) {
            // Keep the original login error for display.
          }
        }

        let errorText = "We couldn't sign you in. Please check your details and try again.";

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          errorText = "Incorrect email or password.";
        } else if (error.code === "permission-denied" ||
                   error.code === "firestore/permission-denied") {
          errorText =
            "We couldn't verify your account right now. Please try again later or contact Kiri Cars support.";
        } else if (error.code === "auth/too-many-requests") {
          errorText = "Too many login attempts. Please wait before trying again.";
        }

        showMessage(errorText);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
